name: Tag release

on:
  push:
    branches: [main]
    paths: ["Cargo.toml"]

concurrency:
  group: tag-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Tag on version bump
    runs-on: ubuntu-latest
    if: github.repository == 'tempusfrangit/arena-alligator'
    steps:
      # The deploy key (not GITHUB_TOKEN) must push the tag: tags pushed with
      # GITHUB_TOKEN do not trigger the tag-driven release workflow.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_TAG_DEPLOY_KEY }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: jdx/mise-action@v4
        with:
          install: false

      - name: Block version downgrades
        run: mise run version:check

      - name: Create and push tag
        run: |
          version="$(cargo pkgid | sed -E 's/.*[@#]//')"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "v${version} already released; nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${version}" -m "v${version}"
          git push origin "v${version}"
